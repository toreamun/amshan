name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm needs the tags to find the version
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check that the version is the tag
        # Also for manual runs: they must be started from a tag.
        shell: python
        run: |
          import os, pathlib
          from packaging.version import Version
          tag = Version(os.environ["GITHUB_REF_NAME"])
          built = {Version(p.name.removeprefix("amshan-").removesuffix(".tar.gz")) for p in pathlib.Path("dist").glob("*.tar.gz")}
          assert built == {tag}, f"built {built}, tag {tag}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          skip-existing: true
