[build-system]
requires = ["setuptools>=77", "setuptools-scm>=10"]
build-backend = "setuptools.build_meta"

[project]
name = "amshan"
dynamic = ["version"]
description = "Decode P1 and MBUS (Meter Bus) DLMS data. Special support for norwegian and swedish meters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tore Amundsen", email = "tore@amundsen.org" }]
requires-python = ">=3.12"
dependencies = ["construct"]
keywords = [
    "meter",
    "han",
    "ams",
    "p1",
    "mbus",
    "aidon",
    "kaifa",
    "kamstrup",
    "dlms",
    "cosem",
    "hdlc",
    "fast frame check",
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

[project.optional-dependencies]
serial = ["pyserial-asyncio>=0.4"]

[project.urls]
Homepage = "https://github.com/toreamun/amshan"
Issues = "https://github.com/toreamun/amshan/issues"

[dependency-groups]
dev = [
    "hypothesis",
    "mypy==2.4.1",
    "paho-mqtt",
    "pyserial-asyncio",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff==0.17.6",
    "syrupy",
    "types-pyserial==3.5.0.20261104",
]

[tool.setuptools]
packages = ["han"]

[tool.setuptools.package-data]
han = ["py.typed"]

# This table enables setuptools-scm; it has no settings. The version is the latest git
# tag (e.g. 2.2.0), or a development version after it.
[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true

[tool.coverage.run]
source = ["han"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
target-version = "py312"
# Keep README examples as written (e.g. hex grouped by field).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "W",
    "UP", "B", "SIM", "RUF", "DTZ", "BLE", "PERF", "C4", "PIE", "RET", "PL", "N",
    "ARG", "PTH", "TRY", "LOG", "G", "S", "FBT", "T20", "ERA", "ASYNC", "A",
]
# Messages passed to built-in exceptions (e.g. ValueError("...")) are fine; no custom
# exception classes.
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, expected values, naive datetimes as the decoders return them,
# boolean test parameters and positional booleans in calls, seeded random data and
# helpers with many arguments.
"tests/**" = ["S101", "PLR2004", "DTZ001", "FBT", "S311", "PLR0913", "PLR0917"]
# The example script logs expected errors (MQTT/serial) with LOG.error without a
# traceback; it then re-raises, retries or shuts down.
"main_mqtt.py" = ["TRY400"]

[tool.mypy]
files = ["han", "tests", "main_mqtt.py", "reader_async.py"]
strict = true

[[tool.mypy.overrides]]
# construct and pyserial-asyncio ship no type information (no py.typed or stubs).
module = ["construct", "serial_asyncio"]
ignore_missing_imports = true
